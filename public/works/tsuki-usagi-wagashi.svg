<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Tsuki Usagi Wagashi thumbnail</title>
  <desc id="desc">Modern wagashi storefront visual with moon, soft pink, and Japanese-inspired composition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12080f"/>
      <stop offset="0.55" stop-color="#070707"/>
      <stop offset="1" stop-color="#160b13"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.72" stop-color="#f7b7d8"/>
      <stop offset="1" stop-color="#f7b7d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="830" cy="318" r="146" fill="url(#moon)" opacity="0.88"/>
  <circle cx="782" cy="292" r="146" fill="#080708"/>
  <circle cx="830" cy="318" r="170" fill="#f7b7d8" opacity="0.12" filter="url(#soft)"/>
  <path d="M650 510c95-70 245-70 340 0" fill="none" stroke="#f7b7d8" stroke-opacity="0.48" stroke-width="5" stroke-linecap="round"/>
  <path d="M690 552c70-46 220-46 290 0" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
  <g fill="#f7b7d8" opacity="0.62">
    <circle cx="748" cy="480" r="28"/>
    <circle cx="826" cy="458" r="28"/>
    <circle cx="904" cy="480" r="28"/>
  </g>
  <rect x="86" y="78" width="1028" height="594" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="104" y="178" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700">Tsuki Usagi</text>
  <text x="108" y="230" fill="#f7b7d8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="8">WAGASHI STORE</text>
  <text x="108" y="560" fill="#ffffff" fill-opacity="0.56" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="4">SEASONAL CRAFT / DIGITAL EC</text>
