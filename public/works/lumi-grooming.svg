<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">LUMI Grooming thumbnail</title>
  <desc id="desc">Premium pet grooming website visual with aqua light and soft studio shapes.</desc>
  <defs>
