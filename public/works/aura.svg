<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">AURA thumbnail</title>
  <desc id="desc">Beauty wellness website visual with violet aura lighting on black.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0914"/>
      <stop offset="0.45" stop-color="#050507"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <radialGradient id="violet" cx="66%" cy="43%" r="46%">
