      <stop offset="0%" stop-color="#c8923a" stop-opacity=".20"/>
      <stop offset="55%" stop-color="#8b5e28" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#130a04" stop-opacity="0"/>
