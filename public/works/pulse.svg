<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Pulse thumbnail</title>
  <desc id="desc">Neon festival landing page visual in magenta and cyan on black.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.48" stop-color="#160711"/>
      <stop offset="1" stop-color="#020205"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d6b"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <path d="M0 565 C155 455 275 640 430 515 C585 390 680 480 800 350 C920 220 1025 300 1200 165" fill="none" stroke="url(#hot)" stroke-width="5" opacity="0.85" filter="url(#glow)"/>
  <path d="M0 610 C155 500 275 685 430 560 C585 435 680 525 800 395 C920 265 1025 345 1200 210" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.22"/>
  <g opacity="0.22" stroke="#ffffff" stroke-width="1">
    <path d="M80 110h1040"/>
    <path d="M80 210h1040"/>
    <path d="M80 310h1040"/>
    <path d="M80 410h1040"/>
    <path d="M80 510h1040"/>
    <path d="M200 70v610"/>
    <path d="M400 70v610"/>
    <path d="M600 70v610"/>
    <path d="M800 70v610"/>
    <path d="M1000 70v610"/>
  </g>
  <circle cx="892" cy="252" r="120" fill="#ff2d6b" opacity="0.14" filter="url(#glow)"/>
  <circle cx="322" cy="506" r="78" fill="#22d3ee" opacity="0.12" filter="url(#glow)"/>
  <text x="82" y="155" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="900">PULSE</text>
  <text x="88" y="205" fill="#ff8ab0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="8">FESTIVAL UI</text>
  <rect x="84" y="582" width="196" height="44" fill="none" stroke="#ff2d6b" opacity="0.9"/>
  <text x="112" y="612" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="5">LIVE STAGE</text>
</svg>
